name: Update NovaPlay Icons

on:
  workflow_dispatch:
  push:
    paths:
      - novaplay.json

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: pip install requests pillow

      - name: Sync
        run: python -u sync_icons.py

      - name: Commit
        run: git add icons && git diff --cached --quiet || (git commit -m "Update icons" && git push)
```
