name: Update NovaPlay Icons

on:
  workflow_dispatch:
  push:
    paths:
      - novaplay.json

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pillow

      - run: python -u sync_icons.py

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons
          git diff --cached --quiet || git commit -m "Update NovaPlay icons"
          git push
```
